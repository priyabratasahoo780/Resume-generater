<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Maximum Words Visualizer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:
    radial-gradient(circle at top,
    #1e3a8a,
    #020617);

    min-height:100vh;

    color:white;

    overflow-x:hidden;
}

.container{

    width:95%;

    max-width:1700px;

    margin:auto;

    padding:30px;
}

.title{

    text-align:center;

    font-size:65px;

    font-weight:700;

    margin-bottom:10px;

    background:
    linear-gradient(
    90deg,
    #38bdf8,
    #22c55e);

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.subtitle{

    text-align:center;

    font-size:24px;

    color:#cbd5e1;

    margin-bottom:40px;
}

/* INPUT */

.input-area{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    flex-wrap:wrap;

    margin-bottom:40px;
}

textarea{

    width:700px;

    height:140px;

    padding:20px;

    border:none;

    outline:none;

    border-radius:20px;

    font-size:20px;

    resize:none;

    background:
    rgba(255,255,255,0.08);

    color:white;

    border:
    2px solid rgba(255,255,255,0.1);
}

textarea:focus{

    border:
    2px solid #38bdf8;

    box-shadow:
    0 0 20px #38bdf8;
}

.generate{

    background:#8b5cf6;

    padding:18px 35px;

    border:none;

    border-radius:18px;

    font-size:22px;

    font-weight:600;

    color:white;

    cursor:pointer;

    transition:0.3s;
}

.generate:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 25px #8b5cf6;
}

/* TOP */

.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:30px;

    flex-wrap:wrap;

    margin-bottom:35px;
}

.live-title{

    font-size:45px;

    color:#38bdf8;
}

.live-step{

    flex:1;

    min-width:350px;

    background:
    rgba(255,255,255,0.08);

    border-left:
    8px solid #22c55e;

    border-radius:22px;

    padding:25px;

    font-size:28px;

    font-weight:600;

    min-height:110px;

    display:flex;

    align-items:center;
}

/* SENTENCES */

.sentences{

    display:flex;

    flex-direction:column;

    gap:30px;

    margin-top:40px;
}

.sentence-box{

    background:
    rgba(255,255,255,0.06);

    border-radius:30px;

    padding:30px;

    transition:0.5s;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.5);
}

.active{

    border:
    3px solid #3b82f6;

    box-shadow:
    0 0 35px #3b82f6;
}

.maximum{

    border:
    3px solid #22c55e;

    box-shadow:
    0 0 40px #22c55e;
}

.sentence{

    font-size:28px;

    line-height:1.8;

    margin-bottom:25px;
}

/* CHARACTERS */

.chars{

    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

.char{

    width:60px;

    height:60px;

    border-radius:18px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:700;

    background:
    linear-gradient(
    145deg,
    #1e293b,
    #0f172a);

    transition:0.4s;
}

.space{

    background:
    linear-gradient(
    145deg,
    #ef4444,
    #dc2626);

    box-shadow:
    0 0 25px #ef4444;
}

.current{

    background:
    linear-gradient(
    145deg,
    #3b82f6,
    #2563eb);

    transform:
    scale(1.15);

    box-shadow:
    0 0 30px #3b82f6;
}

/* STATS */

.stats{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:25px;

    margin-top:45px;
}

.stat-box{

    background:
    rgba(255,255,255,0.06);

    border-radius:25px;

    padding:30px;

    text-align:center;
}

.stat-title{

    font-size:24px;

    color:#94a3b8;

    margin-bottom:10px;
}

.stat-value{

    font-size:50px;

    font-weight:700;

    color:#22c55e;
}

/* BUTTONS */

.controls{

    display:flex;

    justify-content:center;

    gap:20px;

    flex-wrap:wrap;

    margin-top:45px;
}

button{

    border:none;

    padding:18px 35px;

    border-radius:18px;

    font-size:22px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

    color:white;
}

button:hover{
    transform:scale(1.08);
}

.start{
    background:#22c55e;
}

.pause{
    background:#ef4444;
}

.resume{
    background:#3b82f6;
}

.reset{
    background:#f59e0b;
}

/* TABLE */

.table-area{

    margin-top:50px;

    background:
    rgba(255,255,255,0.05);

    border-radius:30px;

    padding:30px;

    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    text-align:center;
}

th{

    background:#38bdf8;

    color:black;

    padding:18px;

    font-size:22px;
}

td{

    padding:18px;

    font-size:20px;

    border-bottom:
    1px solid rgba(255,255,255,0.1);
}

/* RESULT */

.result{

    text-align:center;

    margin-top:50px;

    font-size:60px;

    font-weight:700;

    color:#facc15;
}

@media(max-width:700px){

    .title{
        font-size:42px;
    }

    textarea{
        width:100%;
    }

    .char{
        width:45px;
        height:45px;
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="title">
🚀 Maximum Words Found
</div>

<div class="subtitle">
3D Animated Visual Simulation
</div>

<!-- INPUT -->

<div class="input-area">

<textarea
id="sentencesInput">

alice and bob love leetcode
i think so too
this is great thanks very much

</textarea>

<button class="generate"
onclick="generateSentences()">

🚀 Generate Simulation

</button>

</div>

<!-- STEP -->

<div class="top">

<div class="live-title">
🧠 Live Simulation
</div>

<div class="live-step"
id="stepText">

Generate Sentences First

</div>

</div>

<!-- SENTENCES -->

<div class="sentences"
id="sentencesContainer"></div>

<!-- STATS -->

<div class="stats">

<div class="stat-box">

<div class="stat-title">
Current Words
</div>

<div class="stat-value"
id="currentWords">

0

</div>

</div>

<div class="stat-box">

<div class="stat-title">
Maximum Words
</div>

<div class="stat-value"
id="maxWords">

0

</div>

</div>

<div class="stat-box">

<div class="stat-title">
Current Sentence
</div>

<div class="stat-value"
id="currentSentence">

0

</div>

</div>

</div>

<!-- BUTTONS -->

<div class="controls">

<button class="start"
onclick="startSimulation()">

▶ Start

</button>

<button class="pause"
onclick="pauseSimulation()">

⏸ Pause

</button>

<button class="resume"
onclick="resumeSimulation()">

⏯ Resume

</button>

<button class="reset"
onclick="resetSimulation()">

🔄 Reset

</button>

</div>

<!-- TABLE -->

<div class="table-area">

<table>

<thead>

<tr>
<th>Sentence</th>
<th>Spaces Count</th>
<th>Words Count</th>
<th>Maximum</th>
</tr>

</thead>

<tbody id="dryRunBody">

</tbody>

</table>

</div>

<!-- RESULT -->

<div class="result"
id="result"></div>

</div>

<script>

let sentences = [];

let paused = false;
let running = false;

function generateSentences(){

    sentences =
    document.getElementById(
    "sentencesInput"
    ).value
    .trim()
    .split("\n");

    resetSimulation();

    const container =
    document.getElementById(
    "sentencesContainer"
    );

    container.innerHTML = "";

    sentences.forEach((sentence,index)=>{

        const box =
        document.createElement("div");

        box.classList.add(
        "sentence-box"
        );

        const chars =
        sentence.split("")
        .map(ch=>{

            return `
            <div class="char">
            ${ch === " "
            ? "_"
            : ch}
            </div>
            `;
        }).join("");

        box.innerHTML = `
        <div class="sentence">
        ${sentence}
        </div>

        <div class="chars">
        ${chars}
        </div>
        `;

        container.appendChild(box);
    });

    document.getElementById(
    "stepText"
    ).innerHTML =
    "✅ Sentences Generated. Press Start";
}

async function startSimulation(){

    if(running) return;

    running = true;

    let maxi = 0;

    const boxes =
    document.querySelectorAll(
    ".sentence-box"
    );

    for(let i=0;i<sentences.length;i++){

        while(paused){
            await sleep(200);
        }

        boxes.forEach(box=>{
            box.classList.remove(
            "active"
            );
        });

        boxes[i]
        .classList.add("active");

        document.getElementById(
        "currentSentence"
        ).innerHTML = i + 1;

        let chars =
        boxes[i]
        .querySelectorAll(".char");

        let words = 1;

        for(let j=0;j<chars.length;j++){

            while(paused){
                await sleep(200);
            }

            chars[j]
            .classList.add("current");

            document.getElementById(
            "stepText"
            ).innerHTML =
            `👉 Checking character`;

            await sleep(300);

            let actual =
            sentences[i][j];

            if(actual == ' '){

                words++;

                chars[j]
                .classList.add("space");
            }

            document.getElementById(
            "currentWords"
            ).innerHTML = words;

            chars[j]
            .classList.remove(
            "current"
            );
        }

        maxi = Math.max(maxi, words);

        document.getElementById(
        "maxWords"
        ).innerHTML = maxi;

        addRow(
        i + 1,
        words - 1,
        words,
        maxi
        );

        if(words == maxi){

            boxes[i]
            .classList.add("maximum");
        }

        await sleep(1500);
    }

    document.getElementById(
    "stepText"
    ).innerHTML =
    "🎉 Simulation Completed";

    document.getElementById(
    "result"
    ).innerHTML =
    `🏆 MAXIMUM WORDS = ${document.getElementById("maxWords").innerHTML}`;
}

function addRow(
sentence,
spaces,
words,
maxi){

    const row =
    document.createElement("tr");

    row.innerHTML = `
    <td>${sentence}</td>
    <td>${spaces}</td>
    <td>${words}</td>
    <td>${maxi}</td>
    `;

    document.getElementById(
    "dryRunBody"
    ).appendChild(row);
}

function pauseSimulation(){

    paused = true;

    document.getElementById(
    "stepText"
    ).innerHTML =
    "⏸ Simulation Paused";
}

function resumeSimulation(){

    paused = false;

    document.getElementById(
    "stepText"
    ).innerHTML =
    "▶ Simulation Resumed";
}

function resetSimulation(){

    paused = false;
    running = false;

    document.getElementById(
    "dryRunBody"
    ).innerHTML = "";

    document.getElementById(
    "result"
    ).innerHTML = "";

    document.getElementById(
    "currentWords"
    ).innerHTML = 0;

    document.getElementById(
    "maxWords"
    ).innerHTML = 0;

    document.getElementById(
    "currentSentence"
    ).innerHTML = 0;

    document.getElementById(
    "stepText"
    ).innerHTML =
    "Generate Sentences First";
}

function sleep(ms){

    return new Promise(resolve =>
    setTimeout(resolve,ms));
}

</script>

</body>
</html>
